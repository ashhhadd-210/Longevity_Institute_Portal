name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Quality & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portal_test
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: portal_test
      DB_USERNAME: portal
      DB_PASSWORD: portal
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      CACHE_STORE: array
      SESSION_DRIVER: array

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, pgsql, zip, gd, sodium
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G

      - name: Dependency security audit
        run: composer audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrations run clean on empty PostgreSQL
        run: php artisan migrate:fresh --seed --force

      - name: Tests
        run: php artisan test
